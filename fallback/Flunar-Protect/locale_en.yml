  startup-database: "<gray>Database:</gray> <green>connected</green>"
  startup-core: "<gray>Flunar-Core API:</gray> <green>connected</green>"
  startup-bedrock: "<gray>Bedrock API:</gray> <green>connected</green>"
  startup-author: "<gradient:#fbbf24:#f97316>Code by Jens / Lehrling</gradient>"
