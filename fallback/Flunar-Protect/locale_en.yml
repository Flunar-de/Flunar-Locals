  cause-entity: "entity"
  cause-explosion: "explosion"
  cause-anonymized: "deleted player"
  cause-unknown: "unknown"
  actor-system: "System"
  actor-anonymized: "Deleted player"
  status: "<gray>Status: <white>%state%</white>, queue: <white>%queued%/%capacity%</white>, last batch: <white>%batch%</white>, written: <white>%written%</white>, failures: <white>%failures%</white></gray>"
  invalid-uuid: "<red>The UUID is invalid.</red>"
  delete-confirm: "<yellow>Confirm deletion within 60 seconds using <white>/protect deletedata %uuid% confirm</white>.</yellow>"
  delete-expired: "<red>The deletion confirmation is missing or expired.</red>"
