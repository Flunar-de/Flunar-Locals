  alert-tnt-chain-blocked: "<red>TNT chain protection:</red> <gray>A TNT chain was stopped in world <white>%world%</white> at <white>%x% %y% %z%</white> (chunk <white>%chunk_x% %chunk_z%</white>) because it would have exceeded the limit of <white>%maximum%</white> TNT.</gray>"
