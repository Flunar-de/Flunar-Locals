common:
  noperms: "<red>You do not have permission to do that.</red>"

protect:
  command-description: "Searches block, container, and entity histories"
  usage: "<gray>Usage: <aqua>/protect check</aqua>, <aqua>/protect alerts</aqua>, <aqua>/protect search [filters]</aqua>, <aqua>/protect status</aqua>, or <aqua>/protect deletedata <uuid> [confirm]</aqua>"
  player-only: "<red>This command can only be used by players.</red>"
  check-enabled: "<green>Inspection mode enabled.</green> <gray>Interact with a block, container, or supported entity to see its five latest entries.</gray>"
  check-disabled: "<yellow>Inspection mode disabled.</yellow>"
  lookup-loading: "<gray>Loading block history …</gray>"
  lookup-empty: "<gray>No interactions were recorded for this block during the last 30 days.</gray>"
  lookup-header: "<gray>Latest <aqua>%count%</aqua> interactions at <white>%x% %y% %z%</white>:</gray>"
  lookup-line: "<dark_gray>•</dark_gray> <aqua>%date%</aqua> <gray>–</gray> <white>%material%</white> <gray>%action%</gray> <dark_gray>|</dark_gray> <gray>Responsible:</gray> <white>%actor%</white> <dark_gray>(Cause: %cause%)</dark_gray>"
  lookup-container-line: "<dark_gray>•</dark_gray> <aqua>%date%</aqua> <gray>–</gray> <white>%amount%x %material%</white> <gray>%action%</gray> <dark_gray>|</dark_gray> <gray>Responsible:</gray> <white>%actor%</white> <dark_gray>(Cause: %cause%)</dark_gray>"
  lookup-busy: "<yellow>Too many inspections are already running. Try again shortly.</yellow>"
  lookup-failed: "<red>The block history could not be loaded.</red>"
  storage-unavailable: "<red>This change is temporarily locked because its history cannot be stored safely.</red>"
  action-place: "placed"
  action-remove: "removed"
  action-destroy: "destroyed"
  action-container-add: "stored"
  action-container-remove: "removed from the container"
  action-interact: "used"
  container-unsupported: "<yellow>This container action is not supported for audit-safety reasons.</yellow>"
  container-too-large: "<red>The container action was cancelled because it would create too many history entries.</red>"
  search-invalid: "<red>Invalid search.</red> <gray>Filters: player:, material:, action:, since:, radius:, page:, and export.</gray>"
  search-cooldown: "<yellow>Wait briefly before searching again.</yellow>"
  search-busy: "<yellow>Too many searches are already running. Try again shortly.</yellow>"
  search-failed: "<red>The history could not be searched.</red>"
  search-empty: "<gray>No entries matched these filters.</gray>"
  search-header: "<gray>Search results on page <aqua>%page%</aqua> (<white>%count%</white> entries):</gray>"
  search-line: "<dark_gray>•</dark_gray> <aqua>%date%</aqua> <gray>–</gray> <white>%amount%x %material%</white> <gray>%action%</gray> <gray>at %x% %y% %z%</gray> <dark_gray>|</dark_gray> <gray>Responsible:</gray> <white>%actor%</white> <dark_gray>(Cause: %cause%)</dark_gray>"
  search-next: "<gray>More results: repeat the search with <aqua>page:%page%</aqua> and the same filters.</gray>"
  export-started: "<gray>The CSV export is being created.</gray>"
  export-success: "<green>Exported %count% entries.</green> <gray>File: <white>%path%</white></gray>"
  export-success-truncated: "<yellow>Exported %count% entries; additional matches were truncated by the export limit.</yellow> <gray>File: <white>%path%</white></gray>"
  export-failed: "<red>The CSV export could not be created.</red>"
  alert-blocks: "<red>Activity alert:</red> <white>%player%</white> <gray>removed %count% blocks within %seconds% seconds. Last position: %x% %y% %z%.</gray>"
  alert-valuable: "<red>Valuable-block alert:</red> <white>%player%</white> <gray>removed %count% configured valuable blocks within %seconds% seconds. Last position: %x% %y% %z%.</gray>"
  alert-entities: "<red>Entity alert:</red> <white>%player%</white> <gray>removed %count% protected entities within %seconds% seconds. Last position: %x% %y% %z%.</gray>"
