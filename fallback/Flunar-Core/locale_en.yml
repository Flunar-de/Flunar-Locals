  help-start: "<dark_gray>➥ <gray>/core services start <name> <dark_gray>- <gray>Starts a service"
  help-stop: "<dark_gray>➥ <gray>/core services stop <name> <dark_gray>- <gray>Stops a service"
  help-reload: "<dark_gray>➥ <gray>/core services reload <name> <dark_gray>- <gray>Reloads a service"
  list-header: "<gray><bold>[<reset><#1FADFF><bold>S<reset><#38B6FF><bold>e<reset><#50BFFF><bold>r<reset><#69C8FF><bold>v<reset><#81D1FF><bold>i<reset><#9ADAFF><bold>c<reset><#B2E3FF><bold>e<reset><#CBECFF><bold>s<reset><gray><bold>] <reset><gray>Registered services:"
  list-entry: "<dark_gray>➥ <gray>%service% <dark_gray>- %status%"
  usage-start: "<red>Usage: <gray>/core services start <name>"
  usage-stop: "<red>Usage: <gray>/core services stop <name>"
  usage-reload: "<red>Usage: <gray>/core services reload <name>"
  not-found: "<red>Service <yellow>%service% <red>not found!"
  already-running: "<red>Service <yellow>%service% <red>is already running!"
  already-stopped: "<red>Service <yellow>%service% <red>is already stopped!"
  started: "<green>Service <yellow>%service% <green>has been started!"
  stopped: "<red>Service <yellow>%service% <red>has been stopped!"
  reloaded: "<green>Service <yellow>%service% <green>has been reloaded!"
locale-sync:
  usage: "<yellow>Usage: /core locales sync"
  no-permission: "<red>You are not allowed to run the locale sync."
  started: "<gray>Starting locale sync for all registered plugins, including Core."
  summary: "<gray>Locale sync for profile <white>%profile%</white>: <green>%synced% synced</green>, <red>%failed% failed</red>, <yellow>%not-activated% not activated</yellow>, <gray>%no-remote% without central locales</gray>."
  revision: "<dark_gray>Revision: %revision%</dark_gray>"
  plugin-synced: "<green>✔ %plugin%: synced, revision %revision%%legacy%"
  plugin-failed: "<red>✖ %plugin%: failed: %detail%%legacy%"
  plugin-not-activated: "<yellow>⚠ %plugin%: not activated; the previous cache remains active.%legacy%"
  plugin-no-remote: "<gray>○ %plugin%: no central locales for this profile.%legacy%"
  legacy: " <dark_gray>(Legacy mode: local files remain preferred)</dark_gray>"
  fatal: "<red>Locale sync failed: %detail%"
core-sync:
  usage: "<yellow>Usage: <white>/core sync locales</white> | <white>/core sync titles</white>"
  no-permission: "<red>You are not allowed to run a sync."
  titles:
    started: "<gray>Starting the titles sync. Titles and player selections are reloaded from the database and cached locally."
    success: "<green>Titles sync finished: <white>%count%</white> <green>titles loaded (source: %source%). The title system is now <white>%state%</white><green>."
    failed: "<red>Titles sync failed: %error%. The previous state stays active, which means the local cache."
    not-loaded: "<red>The title system was not loaded at startup. The details are in the console."
    state-active: "active"
    state-inactive: "inactive"
    source-database: "database"
    source-cache: "local cache"

