# Flunar-Core – English texts (fallback)
#
# Layout: sections are grouped by topic. Keys are code paths (for example "titles.result.ok").
# Do not rename keys, otherwise the code cannot find the text.
# Keep placeholders such as %count% or %player% unchanged.

# =============================================================================
# Allgemein
# =============================================================================
noperms: "<red>You don't have permission to do that."
only-player: "Only players can execute this command."
commandusemessage: "<red>Usage: "
unknownsubcommand: "<red>Unknown subcommand."
player-not-found: "<red>Player not found or not online."
unknown-command: "<red>Unknown command: <yellow>%command%<red>. Type /help for help."
command-blocked: "<red>You are frozen and cannot use commands!"
common:
  noperms: "<red>You don't have permission!"
  only-player: "<red>This command is only for players!"
  player-not-found: "<red>Player not found!"
  cooldown: "<red>Please wait %seconds% more seconds!"

# =============================================================================
# Join- und Quit-Nachrichten
# =============================================================================
join-message: "<dark_gray>[<green>+<dark_gray>] <gray>%player%"
quit-message: "<dark_gray>[<red>-<dark_gray>] <gray>%player%"

# =============================================================================
# Spielerbefehle
# =============================================================================
language:
  current: "<gray>Your current language: <yellow>%language%"
  available: "<gray>Available languages: <yellow>%languages%"
  usage: "<gray>Usage: <yellow>/language <language>"
  changed: "<green>Your language has been changed to <yellow>%language%<green>!"
  not-available: "<red>The language <yellow>%language% <red>is not available."
link:
  usage: "<red>Usage: <white>/link CODE<red>. You can find the code in the dashboard on the website."
  invalid-code: "<red>The code is invalid. It consists of twelve characters."
  invalid-name: "<red>Your player name cannot be linked."
  unavailable: "<red>The website link is currently unavailable."
  cooldown: "<red>Please wait a moment before trying again."
  checking: "<gray>Checking link..."
  success: "<green>Your Minecraft account is now linked to your Discord account. You can view the link in the dashboard on the website."
  code-invalid: "<red>This code is invalid or has expired. Create a new code in the dashboard."
  minecraft-account-taken: "<red>This Minecraft account is already linked to another Discord account. Remove the old link in the dashboard first."
  account-platform-already-linked: "<red>An account for this platform is already linked. You can link one account per platform (Java or Bedrock)."
  platform-mismatch: "<red>This code belongs to another platform. Use the code created for your edition (Java or Bedrock)."
  invalid-request: "<red>The link could not be processed. Please try again."
  rate-limited: "<red>There were too many link attempts. Please wait a moment."
  misconfigured: "<red>The website link is not configured correctly on the server. Please inform the Flunar team."
  website-unavailable: "<red>The website is currently unreachable. Please try again later."
gamemode:
  invalid: "<red>Invalid game mode: <yellow>%input%"
  changed-self: "<gray>Game mode set to <yellow>%gamemode%<gray>."
  changed-other: "<gray>Set game mode of <yellow>%player% <gray>to <yellow>%gamemode%<gray>."
  changed-by-other: "<gray>Your game mode was set to <yellow>%gamemode%<gray>."
  name:
    survival: "<green>Survival"
    creative: "<aqua>Creative"
    adventure: "<yellow>Adventure"
    spectator: "<gray>Spectator"
fly:
  enabled: "<green>Flight mode <dark_green>enabled<green>."
  disabled: "<red>Flight mode <dark_red>disabled<red>."
  enabled-other-sender: "<green>Flight mode for <yellow>%player% <green>enabled."
  disabled-other-sender: "<red>Flight mode for <yellow>%player% <red>disabled."
  enabled-other-target: "<green>Your flight mode has been <dark_green>enabled<green>."
  disabled-other-target: "<red>Your flight mode has been <dark_red>disabled<red>."
player-no-perms-other-ip: "<red>You are not allowed to view other players' IPs."
player-ip-show: "<gray>The IP address of <green><player> <gray>is: <yellow><ip>"
bewerben-link: "https://dc.flunar.de"
discord-link: "https://dc.flunar.de"

# =============================================================================
# Teleport
# =============================================================================
tp-to-player: "<green>You have been teleported to <yellow>{target}<green>."
tp-other: "<yellow>{from} <green>was teleported to <yellow>{to}<green>."
tp-all-to: "<green>All players were teleported to <yellow>{to}<green>."
tp-player-to-all: "<green>{from} was teleported to all players."
tp-usage: "<red>/tp <target player>"
tp-self: "<red>You cannot teleport to yourself."
tp-coords: "<green>You have been teleported to coordinates <yellow>X: {x} Y: {y} Z: {z}<green>."
tp-invalid-coords: "<red>Invalid coordinates. Please provide three valid numbers."
tp-other-self: "<red>A player cannot be teleported to themselves."
console-needs-two-players: "<red>The console must specify two player names."
teleport:
  bossbar:
    title: "Teleporting..."
    countdown: "Teleporting in %seconds% seconds..."
  subtitle:
    countdown: "<yellow>%seconds%s"
    cancelled: "<red>Cancelled"
    success: "<green>✓"
  title:
    countdown: "<gold>Teleport"
    cancelled: "<red>Teleport"
    success: "<green>Teleport"

