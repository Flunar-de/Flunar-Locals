# =============================================================================
# Titel
# =============================================================================
titles:
  disabled: "<red>Titles are not available on this server right now. Please try again later or contact the staff."
  notify:
    unlocked: "<green>Title unlocked: %display% <green>– select it with <white>/titles set %title%</white><green>."
    from-team: "<green>A team member gave you the title %display%<green>. Select it with <white>/titles set %title%</white><green>."
  player:
    list-header: "<gray>Your titles <dark_gray>(click a title to set it):"
    usage: "<yellow>Usage: <white>/titles set <title></white> <yellow>or <white>/titles reset</white>"
    list-empty: "<gray>You do not own any titles yet. You can earn them through events or special achievements on the server."
    list-entry: "%mark% <click:run_command:'/titles set %title%'><hover:show_text:'%hover%'>%display%</hover></click>"
    mark-selected: "<green>✔</green>"
    mark-unselected: "<dark_gray>○</dark_gray>"
    hover: "<gray>Click to set this title"
    reset-button: "<click:run_command:'/titles reset'><red>[Remove title]</red></click> <dark_gray>- removes the selected title"
    select:
      ok: "<green>You are now wearing the title %display%<green>. It is shown under your name from now on."
      not-found: "<red>The title <white>%title%</white> <red>does not exist. Use <white>/titles</white> <red>to see all titles you own."
      not-owned: "<red>You do not own the title <white>%title%</white> <red>yet. Collect it before you can select it."
      unavailable: "<red>Your title cannot be changed right now, either because the database is unreachable or because your title data is still loading. Please try again in a few seconds."
      error: "<red>A database error occurred while saving your selection. Your current title stays unchanged."
    reset:
      ok: "<green>Your title has been removed. No title is shown under your name anymore."
      unavailable: "<red>Your title cannot be removed right now, because the database is unreachable or your title data is still loading. Your title stays visible."
      error: "<red>A database error occurred while removing your title. Your title stays visible."
  admin:
    usage: "<yellow>Usage: <white>/core titles list</white> | <white>create <id> <text></white> | <white>update <id> <text></white> | <white>delete <id></white> | <white>give <player> <id></white> | <white>take <player> <id></white> | <white>auto <id> [from] <until></white> | <white>auto <id> delete</white> | <white>auto list</white> | <white>require <id> <permission|none></white>"
    no-permission: "<red>You are not allowed to manage titles."
    player-not-found: "<red>Player not found. They must have joined the server before."
    list-empty: "<gray>No titles exist yet. Create the first one with <white>/core titles create</white><gray>."
    list-permission: "<dark_gray>   ↳ <gray>requires permission <white>%permission%"
    list-entry: "<gray>- <white>%title%</white> <dark_gray>→</dark_gray> %display%"
    auto:
      invalid-date: "<red>The date is invalid. Use the format DD.MM.YYYY, for example 31.12.2027."
      past-date: "<red>The date lies in the past. Choose today or a later date."
      invalid-range: "<red>The start date is after the end date. The start must be on or before the end date."
      list-empty: "<gray>No title has an automatic grant set."
      list-entry: "<gray>- <white>%title%</white> <dark_gray>→</dark_gray> granted automatically until and including %until%"
      list-entry-range: "<gray>- <white>%title%</white> <dark_gray>→</dark_gray> granted automatically from %from% until and including %until%"
      set:
        ok: "<green>The title <white>%title%</white> <green>will be granted automatically to every player who joins until and including <white>%until%</white><green>. Online players without it receive it immediately."
        not-found: "<red>The title <white>%title%</white> <red>does not exist. Create it first with <white>/core titles create</white><red>."
        unavailable: "<red>The automatic grant could not be saved because the database is unreachable. Please try again later."
        error: "<red>A database error occurred while saving. Nothing was changed. The details are in the console."
      set-range:
        ok: "<green>The title <white>%title%</white> <green>will be granted automatically to every player who joins between <white>%from%</white> <green>and <white>%until%</white> <green>(inclusive). Online players without it receive it immediately during that period."
        not-found: "<red>The title <white>%title%</white> <red>does not exist. Create it first with <white>/core titles create</white><red>."
        unavailable: "<red>The automatic grant could not be saved because the database is unreachable. Please try again later."
        error: "<red>A database error occurred while saving. Nothing was changed. The details are in the console."
      remove:
        ok: "<green>The automatic grant for <white>%title%</white> <green>has been removed. Players who already have it keep it."
        not-found: "<red>The title <white>%title%</white> <red>has no automatic grant."
        unavailable: "<red>The automatic grant could not be removed because the database is unreachable. Please try again later."
        error: "<red>A database error occurred while removing. Nothing was changed. The details are in the console."
    create:
      ok: "<green>The title <white>%title%</white> <green>has been created and can be granted from now on. Preview: %display%"
      invalid-id: "<red>The ID <white>%title%</white> <red>is invalid. Use 2 to 32 characters: lowercase letters a to z, digits, _ and -."
      invalid-display: "<red>The display text is empty or too long. It may contain at most 512 characters."
      unavailable: "<red>The title was not created because the database is unreachable. Please try again later."
      error: "<red>A database error occurred while creating the title. Nothing was changed. The details are in the console."
    update:
      ok: "<green>The title <white>%title%</white> <green>has been updated. The new display is %display% <green>and applies immediately to all players who selected it."
      not-found: "<red>The title <white>%title%</white> <red>does not exist. Create it first with <white>/core titles create</white><red>."
      invalid-display: "<red>The display text is empty or too long. It may contain at most 512 characters."
      unavailable: "<red>The title was not updated because the database is unreachable. Please try again later."
      error: "<red>A database error occurred while updating the title. Nothing was changed. The details are in the console."
    delete:
      ok: "<green>The title <white>%title%</white> <green>has been deleted. Players who owned it have lost it, and anyone who had selected it no longer sees it."
      not-found: "<red>The title <white>%title%</white> <red>does not exist. List all titles with <white>/core titles list</white>."
      unavailable: "<red>The title was not deleted because the database is unreachable. Please try again later."
      error: "<red>A database error occurred while deleting the title. Nothing was changed. The details are in the console."
    require:
      set:
        ok: "<green>The title <white>%title%</white> <green>is now bound to the permission <white>%permission%</white>. Players who have it receive the title, players who lose it lose the title automatically. The check runs about every 30 seconds."
        not-found: "<red>The title <white>%title%</white> <red>does not exist. Create it first with <white>/core titles create</white><red>."
        invalid-permission: "<red>The permission <white>%permission%</white> <red>is invalid. Allowed are letters, digits, dots, underscores, hyphens and asterisks."
        unavailable: "<red>The permission could not be saved because the database is unreachable. Please try again later."
        error: "<red>A database error occurred while saving. Nothing was changed. The details are in the console."
      remove:
        ok: "<green>The title <white>%title%</white> <green>is no longer bound to a permission. Players who already have it keep it."
        not-found: "<red>The title <white>%title%</white> <red>has no permission binding."
        unavailable: "<red>The binding could not be removed because the database is unreachable. Please try again later."
        error: "<red>A database error occurred while removing the binding. Nothing was changed. The details are in the console."
    give:
      ok: "<green>The title <white>%title%</white> <green>has been granted to <white>%player%</white><green>. They can set it with <white>/titles set %title%</white><green>."
      already: "<yellow><white>%player%</white> <yellow>already owns the title <white>%title%</white><yellow>. Nothing was changed."
      permission-missing: "<red><white>%player%</white> <red>cannot receive the title <white>%title%</white><red>, because the required permission is missing. The title is bound to a permission. Check the binding with <white>/core titles list</white><red>."
      not-found: "<red>The title <white>%title%</white> <red>does not exist. Create it first with <white>/core titles create</white><red>."
      unavailable: "<red>The title was not granted because the database is unreachable. Please try again later."
      error: "<red>A database error occurred while granting the title. Nothing was changed. The details are in the console."
    take:
      ok: "<green>The title <white>%title%</white> <green>has been removed from <white>%player%</white><green>. If they had selected it, their selection is now empty."
      not-owned: "<red><white>%player%</white> <red>does not own the title <white>%title%</white><red>. Nothing was changed."
      not-found: "<red>The title <white>%title%</white> <red>does not exist. List all titles with <white>/core titles list</white><red>."
      unavailable: "<red>The title was not removed because the database is unreachable. Please try again later."
      error: "<red>A database error occurred while removing the title. Nothing was changed. The details are in the console."

