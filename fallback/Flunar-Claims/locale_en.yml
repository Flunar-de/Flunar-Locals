claims:
  help-title: "<gradient:#82aaff:#e5a6ff><bold>Flunar Claims – Help</bold></gradient>"
  help: |-
    <gray><gradient:#82aaff:#e5a6ff>/chunk claim</gradient> – claim the current chunk
    <gradient:#82aaff:#e5a6ff>/chunk unclaim</gradient> – release the current chunk
    <gradient:#82aaff:#e5a6ff>/chunk unclaim --cluster</gradient> – release the entire claim cluster
    <gradient:#82aaff:#e5a6ff>/chunk info</gradient> – show current chunk information
    <gradient:#82aaff:#e5a6ff>/chunk show</gradient> – show claim borders
    <gradient:#82aaff:#e5a6ff>/chunk show --all</gradient> – show all claims within 12 chunks
    <gradient:#82aaff:#e5a6ff>/chunk map</gradient> – open the nearby chunk map
    <gradient:#82aaff:#e5a6ff>/chunk token</gradient> – view claim rights and tokens
    <gradient:#82aaff:#e5a6ff>/chunk token buy [amount]</gradient> – buy additional claim rights
    <gradient:#82aaff:#e5a6ff>/chunk gamerule</gradient> – configure rules for the current claim cluster
    <gradient:#82aaff:#e5a6ff>/chunk trust [player]</gradient> – grant permissions
    <gradient:#82aaff:#e5a6ff>/chunk untrust [player]</gradient> – remove permissions
    <gradient:#82aaff:#e5a6ff>/chunk ban [player]</gradient> – block a player
    <gradient:#82aaff:#e5a6ff>/chunk unban [player]</gradient> – remove the block
    <gradient:#82aaff:#e5a6ff>/chunk admin [player|top|delete|reload]</gradient> – admin functions</gray>
