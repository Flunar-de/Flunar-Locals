    <gradient:#82aaff:#e5a6ff>/chunk untrust [Spieler]</gradient> – Berechtigung entfernen
    <gradient:#82aaff:#e5a6ff>/chunk ban [Spieler]</gradient> – Spieler aussperren
    <gradient:#82aaff:#e5a6ff>/chunk unban [Spieler]</gradient> – Aussperrung aufheben
