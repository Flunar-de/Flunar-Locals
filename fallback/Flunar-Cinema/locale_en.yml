cinema:
  unavailable: "<red>Cinema is currently starting or shutting down and is not available.</red>"
  players-only: "<red>Only players can use this command.</red>"
  database-error: "<red>The Cinema database is currently unavailable. Please try again later.</red>"
  access-loading: "<yellow>Your Cinema access is still being checked. Please wait a moment.</yellow>"
  invalid-action: "<red>This action is invalid or has already expired.</red>"
  player-not-found: "<red>This player is unknown to Cinema. You can use their UUID instead.</red>"
  cooldown: "<yellow>Please wait another %seconds% second(s) before using this action again.</yellow>"
  labymod-required: "<yellow>You need LabyMod 4 with Watch Party enabled to see the screen.</yellow>"

  help:
    title: "<gradient:#38bdf8:#8b5cf6><b>Flunar Cinema</b></gradient>"
    player-1: "<gray>/cinema rules</gray> <dark_gray>–</dark_gray> <white>Show the cinema rules</white>"
    player-2: "<gray>/cinema stats</gray> <dark_gray>–</dark_gray> <white>Show your statistics</white>"
    player-3: "<gray>/cinema join</gray> <dark_gray>–</dark_gray> <white>Request to join</white>"
    player-4: "<gray>/cinema leave</gray> <dark_gray>–</dark_gray> <white>Leave the watch party</white>"
    player-5: "<gray>/cinema show \\<URL></gray> <dark_gray>–</dark_gray> <white>Play media immediately</white>"
    player-6: "<gray>/cinema add \\<URL></gray> <dark_gray>–</dark_gray> <white>Add media to the queue</white>"
    player-7: "<gray>/cinema skip</gray> <dark_gray>–</dark_gray> <white>Skip the current media</white>"
    player-8: "<gray>/cinema queue [page]</gray> <dark_gray>–</dark_gray> <white>Show the queue</white>"
    player-9: "<gray>/cinema remove \\<position></gray> <dark_gray>–</dark_gray> <white>Remove a queued entry</white>"
    player-10: "<gray>/cinema kick \\<player></gray> <dark_gray>–</dark_gray> <white>Remove a member as the host</white>"
    player-11: "<gray>/cinema break</gray> <dark_gray>–</dark_gray> <white>Pause playback as the host</white>"
    player-12: "<gray>/cinema play</gray> <dark_gray>–</dark_gray> <white>Resume paused playback as the host</white>"
    admin-1: "<gold>/cinema admin ban \\<player></gold>"
    admin-2: "<gold>/cinema admin unban \\<player></gold>"
    admin-3: "<gold>/cinema admin play \\<URL></gold>"
    admin-4: "<gold>/cinema admin join|leave|stop</gold>"
    admin-5: "<gold>/cinema admin reset \\<UUID/player> confirm</gold>"
    admin-6: "<gold>/cinema admin screen list|remove \\<ID></gold>"
    admin-7: "<gold>/cinema admin register</gold> <dark_gray>–</dark_gray> <white>Register the targeted Cinema sign</white>"
    admin-8: "<gold>/cinema admin image \\<URL></gold> <dark_gray>–</dark_gray> <white>Change the global idle image</white>"

  usage:
    add: "<red>Usage: /cinema add \\<URL></red>"
    show: "<red>Usage: /cinema show \\<URL></red>"
    remove: "<red>Usage: /cinema remove \\<position></red>"
    kick: "<red>Usage: /cinema kick \\<player></red>"
    admin: "<yellow>Usage: /cinema admin \\<ban|unban|play|image|join|leave|stop|register|reset|screen></yellow>"
    ban: "<red>Usage: /cinema admin ban \\<player></red>"
    unban: "<red>Usage: /cinema admin unban \\<player></red>"
    admin-play: "<red>Usage: /cinema admin play \\<URL></red>"
    admin-image: "<red>Usage: /cinema admin image \\<URL></red>"
    reset: "<red>Confirmation required: /cinema admin reset \\<UUID/player> confirm</red>"
    register: "<red>Usage: /cinema admin register</red>"
    screen: "<red>Usage: /cinema admin screen \\<list|remove ID></red>"

  rules:
    title: "<gradient:#fbbf24:#f97316><b>Cinema rules – Version %version%</b></gradient>"
    line-1: "<red>1.</red> <white>Racist, antisemitic, and dehumanizing content is prohibited.</white>"
    line-2: "<red>2.</red> <white>Discrimination based on personal characteristics is prohibited.</white>"
    line-3: "<red>3.</red> <white>Content glorifying violence is prohibited.</white>"
    line-4: "<red>4.</red> <white>Extremist propaganda is prohibited.</white>"
    line-5: "<red>5.</red> <white>Unconstitutional symbols and organizations are prohibited.</white>"
    line-6: "<red>6.</red> <white>Pornographic and youth-endangering content is prohibited.</white>"
    line-7: "<red>7.</red> <white>Threats, targeted harassment, and insults are prohibited.</white>"
    line-8: "<red>8.</red> <white>Any other unlawful content is prohibited.</white>"
    line-9: "<red>9.</red> <white>Deliberately disrupting the watch party is prohibited.</white>"
    line-10: "<red>10.</red> <white>Spam and abusive media playback are prohibited.</white>"
    line-11: "<gold>Instructions from the server team must be followed.</gold>"
    accept-button: "<green><b>[ACCEPT RULES]</b></green>"
    decline-button: "<red><b>[DECLINE]</b></red>"
    accept-hover: "<gray>Accept the cinema rules</gray>"
    decline-hover: "<gray>Cancel registration</gray>"
    accepted: "<green>You accepted the current cinema rules.</green>"
    declined: "<yellow>You did not accept the rules and therefore cannot use Cinema.</yellow>"
    invalid-action: "<red>This rule confirmation is invalid or has already been used.</red>"

  stats: "<gradient:#38bdf8:#8b5cf6>Your Cinema statistics:</gradient> <white>%watched% watched videos</white><gray>, </gray><white>%hours% hour(s) and %minutes% minute(s) watch time</white><gray>, </gray><white>%started% started videos</white>"

  party:
    created: "<green>You created the global watch party and are now its host.</green>"
    none: "<red>There is currently no active watch party.</red>"
    full: "<red>The watch party has reached its member limit.</red>"
    already-member: "<yellow>You are already a member of this watch party.</yellow>"
    not-member: "<red>You are not a member of the current watch party.</red>"
    use-join: "<yellow>A watch party is already active. Use /cinema join to request access.</yellow>"
    use-join-sign: "<yellow>Start a watch party using the entrance sign for the desired room.</yellow>"
    left: "<green>You left the watch party.</green>"
    admin-joined: "<green>You joined the watch party administratively.</green>"
    admin-left: "<green>You left the watch party administratively.</green>"
    admin-host-cannot-leave: "<red>The original host can only end the entire party with /cinema leave.</red>"
    admin-stopped: "<green>The watch party was stopped administratively.</green>"
    kick-not-host: "<red>Only the host can remove members from the watch party.</red>"
    kick-not-member: "<red>This player is not a member of the current watch party.</red>"
    kick-host: "<red>The host cannot remove themselves. Use /cinema leave to end the party.</red>"
    kicked-host: "<green>%player% was removed from the watch party.</green>"
    kicked-player: "<yellow>The host removed you from the watch party.</yellow>"
    host-cooldown: "<yellow>After reaching the time limit, you must wait about %minutes% more minute(s).</yellow>"
    host-disconnected: "<yellow>The host disconnected and has %seconds% seconds to return.</yellow>"
    host-reconnected: "<green>You returned in time and are the host again.</green>"
    time-warning: "<yellow>The watch party ends in %minutes% minute(s).</yellow>"
    afk-warning: "<yellow>You are inactive. Your watch party ends in %minutes% minute(s) unless you become active.</yellow>"
    ended-host-left: "<yellow>The watch party ended because the host left.</yellow>"
    ended-host-disconnected: "<yellow>The watch party ended because the host did not return in time.</yellow>"
    ended-time-limit: "<yellow>The watch party ended after reaching its maximum duration.</yellow>"
    ended-host-afk: "<yellow>The watch party ended because the host was inactive for too long.</yellow>"
    ended-admin: "<yellow>The watch party was ended by the server team.</yellow>"
    ended-host-banned: "<yellow>The watch party ended because its host was banned from Cinema.</yellow>"
    ended-shutdown: "<yellow>The watch party ended because the server stopped.</yellow>"

  request:
    sent: "<green>Your join request was sent to the host.</green>"
    already-pending: "<yellow>You already have a pending join request.</yellow>"
    limit-reached: "<red>There are already too many pending join requests.</red>"
    host-notification: "<gradient:#38bdf8:#8b5cf6><b>Join request</b></gradient> <white>%player% wants to join.</white>"
    accept-button: "<green><b>[ACCEPT]</b></green>"
    decline-button: "<red><b>[DECLINE]</b></red>"
    accepted-host: "<green>%player% was added to the watch party.</green>"
    accepted-player: "<green>The host accepted your join request.</green>"
    declined-host: "<yellow>You declined %player%'s request.</yellow>"
    declined-player: "<yellow>The host declined your join request.</yellow>"
    not-host: "<red>Only the host can respond to join requests.</red>"
    invalid: "<red>This join request is invalid or expired.</red>"

  media:
    invalid-url: "<red>This media URL is invalid or not allowed.</red>"

  image:
    invalid-url: "<red>The image URL must be a valid public HTTPS address without credentials, a fragment, or a custom port.</red>"
    updated: "<green>The global Cinema idle image was saved and updated.</green>"

  playback:
    started: "<green>Now playing: <white>%title%</white></green>"
    stopped: "<yellow>Playback stopped. The watch party remains active.</yellow>"
    skipped-next: "<green>Skipped. Next up: <white>%title%</white></green>"
    nothing-playing: "<red>No video or stream is currently playing.</red>"
    paused: "<yellow>Playback was paused.</yellow>"
    resumed: "<green>Playback resumed.</green>"
    already-paused: "<yellow>Playback is already paused.</yellow>"
    already-playing: "<yellow>Playback is already running.</yellow>"
    control-not-host: "<red>Only the host or a Cinema administrator can pause or resume playback.</red>"

  queue:
    added: "<green><white>%title%</white> was added at position %position%.</green>"
    removed: "<yellow>Position %position% (<white>%title%</white>) was removed.</yellow>"
    full: "<red>The queue is full.</red>"
    empty: "<gray>The queue is empty.</gray>"
    invalid-position: "<red>This queue position is invalid.</red>"
    invalid-page: "<red>This page does not exist. Available pages: 1 to %pages%.</red>"
    title: "<gradient:#38bdf8:#8b5cf6><b>Queue – Page %page%/%pages%</b></gradient>"
    entry: "<gray>#%position%</gray> <white>%title%</white> <dark_gray>|</dark_gray> <aqua>%duration%</aqua> <dark_gray>|</dark_gray> <gray>by %player%</gray>"
    live: "Live stream"
    duration-unknown: "Unknown duration"

  ban:
    active: "<red>You are permanently banned from Flunar Cinema.</red>"
    already-banned: "<yellow>This player is already banned from Cinema.</yellow>"
    not-banned: "<yellow>This player is not banned from Cinema.</yellow>"
    created: "<green>%player% was permanently banned from Cinema.</green>"
    removed: "<green>%player%'s Cinema ban was removed.</green>"

  reset:
    completed: "<green>%player%'s personal Cinema data was deleted. An active ban was preserved.</green>"

  sign:
    look-at-sign: "<red>You must look at a Cinema sign within 6 blocks.</red>"
    invalid-registration-syntax: "<red>Sign syntax: line 1 fln:, line 2 screen or join, followed by the matching values.</red>"
    invalid-join-syntax: "<red>Sign syntax: line 1 fln:, line 2 join, line 3 room/screen ID, line 4 empty.</red>"
    join-registered: "<green>The entrance sign for room %room% was registered and protected.</green>"
    already-registered: "<red>An entrance sign is already registered at this position.</red>"
    save-failed: "<red>The entrance sign could not be saved safely.</red>"
    removed: "<green>The entrance sign was removed.</green>"
    remove-failed: "<red>The entrance sign could not be removed safely.</red>"
    unknown-room: "<red>No screen is registered for room %room%.</red>"

  screen:
    invalid-syntax: "<red>Sign syntax: line 1 fln:, line 2 screen, line 3 ID, line 4 any size up to the configured limit, such as 21x12 or 21.</red>"
    wall-sign-required: "<red>A Cinema screen requires a wall sign.</red>"
    invalid-id: "<red>The screen ID may only contain a-z, 0-9, _ and - and may be at most 16 characters long.</red>"
    invalid-size: "<red>Invalid screen size. Use width x height such as 21x12 or only a width such as 21.</red>"
    already-exists: "<red>A screen already exists at this position or with this ID.</red>"
    limit-reached: "<red>The maximum number of Cinema screens has been reached.</red>"
    registered: "<green>Screen %id% with size %size% was registered.</green>"
    save-failed: "<red>The screen could not be saved safely.</red>"
    activated: "<green>The Cinema screen was synchronized for you.</green>"
    removed: "<green>Screen %id% was removed.</green>"
    remove-failed: "<red>The screen could not be removed safely.</red>"
    unknown: "<red>There is no screen with the ID %id%.</red>"
    list-title: "<gradient:#38bdf8:#8b5cf6><b>Screens (%count%)</b></gradient>"
    list-entry: "<gray>%id%:</gray> <white>%world% %x% %y% %z%</white>"

  actionbar:
    now-playing: "<gradient:#38bdf8:#8b5cf6>▶ Cinema</gradient> <dark_gray>|</dark_gray> <white>Now playing: %title%</white>"
    paused: "<gradient:#38bdf8:#8b5cf6>Ⅱ Cinema</gradient> <dark_gray>|</dark_gray> <yellow>Paused: %title%</yellow>"
    ended: "<gradient:#38bdf8:#8b5cf6>■ Cinema</gradient> <dark_gray>|</dark_gray> <yellow>Playback ended</yellow>"
