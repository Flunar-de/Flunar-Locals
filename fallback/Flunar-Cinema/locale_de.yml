  rules:
    title: "<gradient:#fbbf24:#f97316><b>Kinoregeln – Version %version%</b></gradient>"
    line-1: "<red>1.</red> <white>Rassistische, antisemitische und menschenverachtende Inhalte sind verboten.</white>"
    line-2: "<red>2.</red> <white>Diskriminierung aufgrund persönlicher Merkmale ist verboten.</white>"
    line-3: "<red>3.</red> <white>Gewaltverherrlichende Inhalte sind verboten.</white>"
    line-4: "<red>4.</red> <white>Extremistische Propaganda ist verboten.</white>"
    line-5: "<red>5.</red> <white>Verfassungswidrige Symbole und Organisationen sind verboten.</white>"
    line-6: "<red>6.</red> <white>Pornografische und jugendgefährdende Inhalte sind verboten.</white>"
    line-7: "<red>7.</red> <white>Drohungen, gezielte Belästigungen und Beleidigungen sind verboten.</white>"
    line-8: "<red>8.</red> <white>Sonstige rechtswidrige Inhalte sind verboten.</white>"
    line-9: "<red>9.</red> <white>Absichtliche Störungen der Watchparty sind verboten.</white>"
    line-10: "<red>10.</red> <white>Spam und missbräuchliche Videowiedergabe sind verboten.</white>"
    line-11: "<gold>Anweisungen des Serverteams müssen befolgt werden.</gold>"
    accept-button: "<green><b>[REGELN AKZEPTIEREN]</b></green>"
    decline-button: "<red><b>[ABLEHNEN]</b></red>"
    accept-hover: "<gray>Kinoregeln verbindlich akzeptieren</gray>"
    decline-hover: "<gray>Kinoregeln ablehnen</gray>"
    accepted: "<green>Du hast die aktuelle Version der Kinoregeln akzeptiert.</green>"
    declined: "<yellow>Du hast die Kinoregeln nicht akzeptiert und kannst das Kino deshalb nicht nutzen.</yellow>"
    invalid-action: "<red>Diese Regelbestätigung ist ungültig oder wurde bereits verwendet.</red>"

  stats: "<gradient:#38bdf8:#8b5cf6>Deine Cinema-Statistik:</gradient> <white>%watched% angesehene Videos</white><gray>, </gray><white>%hours% Stunde(n) und %minutes% Minute(n) Wiedergabezeit</white><gray>, </gray><white>%started% gestartete Videos</white>"

