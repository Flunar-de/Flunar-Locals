common:
  only-player: "<red>This command can only be used by players.</red>"
  no-permission: "<red>You do not have permission to do that.</red>"
  service-unavailable: "<red>The marriage features are currently unavailable. Please try again later.</red>"
  database-unavailable: "<red>The marriage database is currently unavailable. Please try again later.</red>"
  operation-running: "<yellow>Your previous marriage action is still being processed.</yellow>"
  invalid-name: "<red>The supplied player name is invalid.</red>"
  player-not-found: "<red>Player <aqua>%player%</aqua> was not found.</red>"
  player-offline: "<red>Player <aqua>%player%</aqua> must be online on the same lobby.</red>"
  cooldown: "<yellow>Please wait another <white>%time%</white>.</yellow>"
  internal-error: "<red>The action could not be completed because of an internal error.</red>"
  usage: "<gray>Usage: <white>%usage%</white></gray>"
church:
  required: "<red>You must both be in the church for that.</red>"
proposal:
  self: "<red>You cannot propose to yourself.</red>"
  sent: "<green>You sent <aqua>%player%</aqua> a marriage proposal.</green>"
  received: "<light_purple><aqua>%player%</aqua> proposed to you: </light_purple><click:run_command:'/marriage accept'><hover:show_text:'<green>Accept marriage proposal</green>'><green><bold>[ACCEPT]</bold></green></hover></click> <gray>or</gray> <click:run_command:'/marriage deny'><hover:show_text:'<red>Deny marriage proposal</red>'><red><bold>[DENY]</bold></red></hover></click>"
  already-married-self: "<red>You are already married.</red>"
  already-married-target: "<red><aqua>%player%</aqua> is already married.</red>"
  pending-self: "<yellow>You are already involved in an open proposal.</yellow>"
  pending-target: "<yellow><aqua>%player%</aqua> is already involved in an open proposal.</yellow>"
  cooldown-self: "<yellow>You were recently divorced and can propose again in <white>%time%</white>.</yellow>"
  target-recently-divorced: "<yellow><aqua>%player%</aqua> was recently divorced and cannot marry for another <white>%time%</white>. Your own cooldown remains unchanged.</yellow>"
  none: "<yellow>You do not have an open marriage proposal.</yellow>"
  expired: "<yellow>The marriage proposal has expired.</yellow>"
  denied: "<yellow>You denied <aqua>%player%</aqua>'s marriage proposal.</yellow>"
  denied-proposer: "<red><aqua>%player%</aqua> denied your marriage proposal.</red>"
  proposer-offline: "<yellow>The proposer must be online on the same lobby.</yellow>"
marriage:
