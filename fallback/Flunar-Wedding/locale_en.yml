  status-duration: "<gray>Marriage duration: <gold>%years%</gold> years, <gold>%months%</gold> months and <gold>%days%</gold> days.</gray>"
  status-since: "<gray>Married since: <gold>%date%</gold>.</gray>"
  status-single: "<yellow><aqua>%player%</aqua> is not married.</yellow>"
  divorce-cooldown: "<yellow>You are newly married. Divorce is possible in <white>%time%</white>.</yellow>"
  divorce-partner-offline: "<yellow>Your partner must be online for a normal divorce.</yellow>"
  divorced: "<yellow>You divorced <aqua>%player%</aqua>.</yellow>"
  divorced-partner: "<yellow><aqua>%player%</aqua> divorced you.</yellow>"
  moderator-divorced: "<green>The marriage of <aqua>%player%</aqua> and <gold>%partner%</gold> was dissolved.</green>"
  timer-reset: "<green>The marriage cooldown of <aqua>%player%</aqua> was reset.</green>"
  timer-not-found: "<yellow><aqua>%player%</aqua> did not have a marriage cooldown.</yellow>"
cost:
  insufficient: "<red>You need <white>%amount%</white> coins but only have <white>%balance%</white>.</red>"
  charged-proposal: "<gray><white>%amount%</white> coins were charged for the proposal.</gray>"
  charged-divorce: "<gray><white>%amount%</white> coins were charged for the divorce.</gray>"
  refunded: "<yellow>The action failed. <white>%amount%</white> coins were refunded.</yellow>"
