  partner-offline: "<yellow>Your partner is currently offline.</yellow>"
  local-success: "<green>You were teleported to <aqua>%player%</aqua>.</green>"
  remote-start: "<aqua>You are being connected to <aqua>%player%</aqua>'s server.</aqua>"
