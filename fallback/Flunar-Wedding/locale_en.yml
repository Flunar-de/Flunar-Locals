  received: "<light_purple><aqua>%player%</aqua> kissed you.</light_purple>"
  title: "<light_purple>❤ Kiss ❤</light_purple>"
  subtitle: "<aqua>%player%</aqua><gray> kissed you</gray>"
presence:
  online: "<green>Your partner <aqua>%player%</aqua> is now online.</green>"
  online-server: "<green>Your partner <aqua>%player%</aqua> is now online on <gold>%server%</gold>.</green>"
  offline: "<gray>Your partner <aqua>%player%</aqua> is now offline.</gray>"
  switched: "<aqua>Your partner <light_purple>%player%</light_purple> switched to server <gold>%server%</gold>.</aqua>"
  current-online: "<green>Your partner <aqua>%player%</aqua> is currently online.</green>"
  current-online-server: "<green>Your partner <aqua>%player%</aqua> is currently online on <gold>%server%</gold>.</green>"
  current-offline: "<gray>Your partner <aqua>%player%</aqua> is currently offline.</gray>"
notification:
  enabled: "<green>Partner presence messages and wedding broadcasts are now enabled.</green>"
  disabled: "<gray>Partner presence messages and other players' wedding broadcasts are now disabled.</gray>"
data-deletion:
  confirmation-required: "<yellow>This permanently deletes all Wedding data for the UUID. Repeat the command with <red>confirm</red>.</yellow>"
  invalid-uuid: "<red>The supplied UUID is invalid.</red>"
  player-online: "<red>The player must be offline across the entire network for a complete data deletion.</red>"
  completed: "<green>The stored Wedding data was deleted completely.</green>"
  not-found: "<yellow>No Wedding data was stored for this UUID.</yellow>"
