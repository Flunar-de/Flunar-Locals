# Flunar-Playtimesystem – deutsche Texte (Standard-Fallback)
#
# Schlüssel nicht umbenennen, sonst findet der Code den Text nicht.
# Platzhalter wie %time%, %player%, %count% oder %rank% bitte unverändert lassen.
# Zeitangaben setzt das Plugin einheitlich aus Tagen, Stunden und Minuten zusammen
# (z. B. "2 Tage, 5 Stunden, 30 Minuten"); die Einheiten stehen unter "time-unit-*".
# Farben: aktive Zeit grün (#4ade80), AFK-Zeit rot (#f87171).

# =============================================================================
# Allgemein
# =============================================================================
noperms: "<#f87171>Dazu hast du keine Berechtigung."
no-permission: "<#f87171>Dir fehlt die Berechtigung <white>%permission%</white><#f87171>."
only-player: "<#f87171>Nur Spieler können diesen Befehl ausführen."
commandusemessage: "<#f87171>Benutze <dark_gray>»</dark_gray> "
unknownsubcommand: "<#f87171>Unbekannter Unterbefehl. <gray>Alle Befehle: <click:run_command:'/online help'><hover:show_text:'<gray>Klicken zum Öffnen'><#7dd3fc>/online help</#7dd3fc></hover></click>"
db-error: "<#f87171>Die Spielzeitdaten sind gerade nicht erreichbar. Bitte versuche es gleich erneut."

# =============================================================================
# Zeit- und Datumsformat
# =============================================================================
time-unit-day: "Tag"
time-unit-days: "Tage"
time-unit-hour: "Stunde"
time-unit-hours: "Stunden"
time-unit-minute: "Minute"
time-unit-minutes: "Minuten"
date-format: "dd.MM.yyyy HH:mm"
date-unknown: "unbekannt"

