online-help-3: "<dark_gray>▪</dark_gray> <click:suggest_command:'/online player '><hover:show_text:'<gray>Klicken zum Einfügen'><#7dd3fc>/online player <Spieler></#7dd3fc></hover></click> <dark_gray>»</dark_gray> <gray>Spielzeit eines Spielers"
online-help-4: "<dark_gray>▪</dark_gray> <click:run_command:'/online top'><hover:show_text:'<gray>Klicken zum Ausführen'><#7dd3fc>/online top</#7dd3fc></hover></click> <dark_gray>»</dark_gray> <gray>Spielzeit-Topliste"
online-help-5: "<dark_gray>▪</dark_gray> <click:run_command:'/online registered'><hover:show_text:'<gray>Klicken zum Ausführen'><#7dd3fc>/online registered</#7dd3fc></hover></click> <dark_gray>»</dark_gray> <gray>Registrierte Spieler"
