online-help-1: "<dark_gray>▪</dark_gray> <click:run_command:'/online'><hover:show_text:'<gray>Klicken zum Ausführen'><#7dd3fc>/online</#7dd3fc></hover></click> <dark_gray>»</dark_gray> <gray>Deine Spielzeit"
