# Flunar-Playtimesystem – English texts (fallback)
#
# Do not rename keys, otherwise the code cannot find the text.
# Keep placeholders such as %time%, %player%, %count% or %rank% unchanged.
# The plugin builds every duration from days, hours and minutes
# (e.g. "2 days, 5 hours, 30 minutes"); the unit names are under "time-unit-*".
# Colours: active time green (#4ade80), AFK time red (#f87171).

# =============================================================================
# General
# =============================================================================
noperms: "<#f87171>You don't have permission to do that."
no-permission: "<#f87171>You are missing the permission <white>%permission%</white><#f87171>."
only-player: "<#f87171>Only players can execute this command."
commandusemessage: "<#f87171>Usage <dark_gray>»</dark_gray> "
unknownsubcommand: "<#f87171>Unknown subcommand. <gray>All commands: <click:run_command:'/online help'><hover:show_text:'<gray>Click to open'><#7dd3fc>/online help</#7dd3fc></hover></click>"
db-error: "<#f87171>Playtime data is currently unavailable. Please try again in a moment."

# =============================================================================
# Time and date format
# =============================================================================
time-unit-day: "day"
time-unit-days: "days"
time-unit-hour: "hour"
time-unit-hours: "hours"
time-unit-minute: "minute"
time-unit-minutes: "minutes"
date-format: "yyyy-MM-dd HH:mm"
date-unknown: "unknown"

# =============================================================================
# Help (/online help)
# =============================================================================
online-help-header: "<dark_gray>»</dark_gray> <gradient:#38bdf8:#22c55e>Playtime</gradient> <dark_gray>·</dark_gray> <gray>Commands</gray> <dark_gray>«</dark_gray>"
online-help-1: "<dark_gray>▪</dark_gray> <click:run_command:'/online'><hover:show_text:'<gray>Click to run'><#7dd3fc>/online</#7dd3fc></hover></click> <dark_gray>»</dark_gray> <gray>Your playtime"
online-help-2: "<dark_gray>▪</dark_gray> <click:run_command:'/online stats'><hover:show_text:'<gray>Click to run'><#7dd3fc>/online stats</#7dd3fc></hover></click> <dark_gray>»</dark_gray> <gray>Your statistics"
online-help-3: "<dark_gray>▪</dark_gray> <click:suggest_command:'/online player '><hover:show_text:'<gray>Click to insert'><#7dd3fc>/online player <player></#7dd3fc></hover></click> <dark_gray>»</dark_gray> <gray>Another player's playtime"
online-help-4: "<dark_gray>▪</dark_gray> <click:run_command:'/online top'><hover:show_text:'<gray>Click to run'><#7dd3fc>/online top</#7dd3fc></hover></click> <dark_gray>»</dark_gray> <gray>Playtime leaderboard"
online-help-5: "<dark_gray>▪</dark_gray> <click:run_command:'/online registered'><hover:show_text:'<gray>Click to run'><#7dd3fc>/online registered</#7dd3fc></hover></click> <dark_gray>»</dark_gray> <gray>Registered players"
online-help-admin-1: "<dark_gray>▪</dark_gray> <click:suggest_command:'/online admin player '><hover:show_text:'<gray>Click to insert'><#facc15>/online admin player <player></#facc15></hover></click> <dark_gray>»</dark_gray> <gray>Player info"
online-help-admin-2: "<dark_gray>▪</dark_gray> <click:suggest_command:'/online admin reset '><hover:show_text:'<gray>Click to insert'><#facc15>/online admin reset <player></#facc15></hover></click> <dark_gray>»</dark_gray> <gray>Reset playtime"

