clan.help.kick-desc: "<dark_gray>» Entfernt einen Spieler aus dem Clan"
clan.help.promote: "• <green>/clan promote <Spieler>"
clan.help.promote-desc: "<dark_gray>» Befördert ein Mitglied zum Moderator"
clan.help.demote: "• <yellow>/clan demote <Spieler>"
clan.help.demote-desc: "<dark_gray>» Degradiert einen Moderator zum Mitglied"
clan.help.delete: "• <red>/clan delete"
clan.help.delete-desc: "<dark_gray>» Löscht deinen Clan"
clan.help.info: "• <green>/clan info <Name>"
clan.help.info-desc: "<dark_gray>» Zeigt Informationen über einen Clan an"
