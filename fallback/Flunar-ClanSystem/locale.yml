# Clan Help Command
clan.help.title: "Clan"
clan.help.commands-label: "Verfügbare Befehle:"
clan.help.create: "• <aqua>/clan create <Name> <Tag>"
clan.help.create-desc: "<dark_gray>» Erstellt einen neuen Clan"
