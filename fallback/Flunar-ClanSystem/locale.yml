clan.help.invite-desc: "<dark_gray>» Lädt einen Spieler in deinen Clan ein"
clan.help.accept: "• <aqua>/clan accept"
clan.help.accept-desc: "<dark_gray>» Nimmt eine Clan-Einladung an"
clan.help.leave: "• <yellow>/clan leave"
clan.help.leave-desc: "<dark_gray>» Verlässt deinen aktuellen Clan"
clan.help.color: "• <aqua>/clan color <Farbe>"
clan.help.color-desc: "<dark_gray>» Ändert die Clanfarbe"
