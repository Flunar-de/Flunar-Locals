key-shop:
  title: "<gradient:#38bdf8:#a855f7>CRATE KEYS</gradient>"
  page-suffix: " <dark_gray>· {page}/{total}"
  empty: "<gradient:#94a3b8:#e2e8f0>NO OFFERS</gradient>"
  empty-lore: "<gray>No crate keys are currently for sale."
  back: "<gradient:#38bdf8:#6366f1>BACK</gradient>"
  price-header: "<dark_gray>╭──── <aqua>PRICE OVERVIEW <dark_gray>────╮"
  price: "<gray>Unit price: <gold>{price}"
  open-amounts: "<aqua>Click: Choose amount"
  amount-title: "<dark_gray>Choose amount"
  amount: "<gradient:#38bdf8:#a855f7>BUY {amount}×</gradient>"
  amount-header: "<dark_gray>╭──── <aqua>TRADE VALUE <dark_gray>────╮"
