  payout-busy-or-changed: "<yellow>The operation is still active or its ID no longer matches. Nothing was changed.</yellow>"
  payout-cleared: "<green>The manually verified operation was cleared. No money was paid.</green>"
  invalid-crate: "<gradient:#ff9955:#ff5555>This crate type does not exist.</gradient>"
  invalid-amount: "<gradient:#ff9955:#ff5555>The amount must be between 1 and 64.</gradient>"
  action-failed: "<gradient:#ff9955:#ff5555>The action could not be completed right now.</gradient>"
  player-not-found: "<gradient:#ff9955:#ff5555>Player {player} was not found.</gradient>"
  target-block-missing: "<gradient:#ff9955:#ff5555>Look at a block within 6 blocks.</gradient>"
  wrong-block: "<gradient:#ff9955:#ff5555>This crate requires a {block} block.</gradient>"
  location-used: "<gradient:#ff9955:#ff5555>A crate is already registered at this block.</gradient>"
  location-missing: "<gradient:#ff9955:#ff5555>This block is not registered as a crate.</gradient>"
  set-success: "<gradient:#55ff99:#33bbff>{crate} was registered at this block.</gradient>"
  remove-success: "<gradient:#55ff99:#33bbff>The crate was removed from this block.</gradient>"
  key-given: "<gradient:#55ff99:#33bbff>{amount}× {crate} keys were given to {player}.</gradient>"
  key-given-all: "<gradient:#55ff99:#33bbff>{amount}× {crate} keys given to {count}/{total} online players.</gradient> <yellow>Failed: {failed}.</yellow>"
  key-received: "<gradient:#55ff99:#33bbff>You received {amount}× {crate} keys.</gradient>"
  key-received-dropped: "<gradient:#55ff99:#33bbff>{amount}× {crate} keys were issued to you.</gradient> <yellow>{dropped}× dropped near you because your inventory was full.</yellow>"
  reload-success: "<gradient:#55ff99:#33bbff>Crates, particles and languages were reloaded.</gradient>"
  reload-failed: "<gradient:#ff9955:#ff5555>The crate configuration could not be reloaded.</gradient>"

