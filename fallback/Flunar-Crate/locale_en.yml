  lore-footer: "<dark_gray>╰────────────────────╯"
  confirm-title: "<gradient:#55ff99:#33bbff>Confirm purchase</gradient>"
  confirm-description: "<gray>You are buying <white>{amount}× {crate} keys</white> for <gold>{price}</gold>.</gray>"
  confirm-buy: "<green>Buy</green>"
  confirm-cancel: "<red>Cancel</red>"
  usage: "<aqua>/crates buy</aqua>"
  success: "<green>You bought {amount}× {crate} keys for {price}.</green>"
  unavailable: "<yellow>The key shop is currently unavailable. Please try again later.</yellow>"
  changed: "<yellow>This offer is no longer current. Please reopen the key shop.</yellow>"
  inventory-full: "<yellow>You do not have enough inventory space for the keys.</yellow>"
  insufficient-funds: "<yellow>You do not have enough money for this purchase.</yellow>"
  failed: "<red>The purchase could not be completed. No money was charged.</red>"
  pending: "<yellow>Your purchased keys are pending delivery. Make room in your inventory and try again.</yellow>"
  review: "<yellow>Your last key purchase needs to be checked. Please contact the server team.</yellow>"
  review-usage: "<yellow>/crates purchase <player> status or /crates purchase <player> clear <operation-id> — only clear after manually checking payment and delivery; this grants neither keys nor money.</yellow>"
  review-none: "<gray>This player has no pending key purchase.</gray>"
  review-status: "<aqua>{player}</aqua><gray>: {amount}× {crate}, price {price}, operation </gray><yellow>{operation}</yellow><gray>. Check payment and delivery before clearing.</gray>"
  review-cleared: "<green>The manually checked purchase was cleared. No keys or money were granted.</green>"
  review-busy: "<yellow>The purchase is active, unavailable or the operation ID does not match. Nothing was changed.</yellow>"

command:
  crate-disabled: "<yellow>This crate is still disabled. Set enabled: true in crates/{id}.yml and run /crates reload.</yellow>"
  player-only: "<gradient:#ff9955:#ff5555>This command is only available to players.</gradient>"
  not-ready: "<gradient:#fbbf24:#f97316>The crate system is still loading.</gradient>"
  usage: "<gradient:#38bdf8:#6366f1>Shop: /crates buy · Admin: /crates <key|reward|set|remove|reload|payout|purchase|deletedata></gradient>"
  delete-usage: "<yellow>/crates deletedata <UUID> confirm</yellow>"
  delete-offline: "<yellow>The player must be online to delete crate data.</yellow>"
  delete-busy: "<yellow>A crate purchase or reward is still open. No data was deleted.</yellow>"
  delete-failed: "<red>Crate data could not be fully deleted. Try again later.</red>"
  delete-success: "<green>The player's crate data was deleted.</green>"
  all-usage: "<yellow>/crates key all <crate> <amount> — gives 1–64 keys to every currently online player.</yellow>"
  all-busy: "<yellow>Key delivery to all players is already running or on cooldown.</yellow>"
  all-empty: "<yellow>No players are online to receive keys.</yellow>"
  payout-usage: "<yellow>/crates payout <player> status or /crates payout <player> clear <operation-id> — use clear only after manual verification; it does not pay money.</yellow>"
  payout-none: "<gray>This player has no pending crate money reward.</gray>"
