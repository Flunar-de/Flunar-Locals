job-descriptions:
  farmer:
    line-1: "<gray>Harvest fully grown crops and"
    line-2: "<gray>naturally grown melons and pumpkins."
  lumberjack:
    line-1: "<gray>Fell natural trees with an axe"
    line-2: "<gray>and collect their logs."
  florist:
    line-1: "<gray>Discover and gather flowers"
    line-2: "<gray>that grew naturally in the world."
  fisher:
    line-1: "<gray>Catch fish and discover rare"
    line-2: "<gray>treasures from the water."
  miner:
    line-1: "<gray>Mine natural ores and rare"
    line-2: "<gray>resources deep underground."
  diver:
    line-1: "<gray>Recover natural coral, prismarine"
    line-2: "<gray>and rare treasures from the oceans."
  hunter:
    line-1: "<gray>Defeat passive, hostile and"
    line-2: "<gray>especially dangerous creatures."
  smith:
    line-1: "<gray>Craft tools, weapons, shields"
    line-2: "<gray>and protective armor."
  trader:
    line-1: "<gray>Trade with players, villagers"
    line-2: "<gray>and wandering traders."
  adventurer:
    line-1: "<gray>Choose two jobs that grant you"
    line-2: "<gray>double experience and income."
  explorer:
    line-1: "<gray>Explore new areas and discover"
    line-2: "<gray>previously unknown parts of the world."
