jobs:
  farmer: "Farmer"
  explorer: "Erkunder"
  miner: "Miner"
  diver: "Taucher"
  smith: "Schmied"
  lumberjack: "Holzfäller"
  florist: "Florist"
  trader: "Trader"
  fisher: "Fischer"
  adventurer: "Abenteurer"
  hunter: "Jäger"
job-descriptions:
  farmer:
    line-1: "<gray>Ernte reife Feldfrüchte sowie"
    line-2: "<gray>natürlich gewachsene Melonen und Kürbisse."
  lumberjack:
    line-1: "<gray>Fälle natürliche Bäume mit einer Axt"
    line-2: "<gray>und sammle ihre Holzstämme."
  florist:
    line-1: "<gray>Entdecke und pflücke Blumen,"
    line-2: "<gray>die natürlich in der Welt gewachsen sind."
  fisher:
    line-1: "<gray>Angle Fische und entdecke dabei"
    line-2: "<gray>seltene Schätze aus dem Wasser."
  miner:
    line-1: "<gray>Baue natürliche Erze und seltene"
    line-2: "<gray>Rohstoffe tief unter der Erde ab."
  diver:
    line-1: "<gray>Berge natürliche Korallen, Prismarin"
    line-2: "<gray>und seltene Schätze aus den Ozeanen."
  hunter:
    line-1: "<gray>Besiege friedliche, feindliche"
    line-2: "<gray>und besonders gefährliche Kreaturen."
  smith:
    line-1: "<gray>Fertige Werkzeuge, Waffen, Schilde"
    line-2: "<gray>und schützende Rüstungen an."
  trader:
    line-1: "<gray>Handle mit Spielern, Dorfbewohnern"
    line-2: "<gray>und wandernden Händlern."
  adventurer:
    line-1: "<gray>Wähle zwei Jobs, in denen du"
    line-2: "<gray>doppelte XP und Einnahmen erhältst."
  explorer:
    line-1: "<gray>Erkunde neue Gebiete und entdecke"
    line-2: "<gray>noch unbekannte Teile der Welt."
