    description-2: "<gray>friedliche und feindliche Monster."
  hunter_pursuit_speed:
    name: "Verfolgung"
    description-1: "<gray>Erhöht dein Tempo bei der"
    description-2: "<gray>Jagd auf fliehende Kreaturen."
  hunter_night_hunt:
    name: "Nachtjagd"
    description-1: "<gray>Verleiht klare Sicht bei"
    description-2: "<gray>nächtlichen Jagden und in Höhlen."
