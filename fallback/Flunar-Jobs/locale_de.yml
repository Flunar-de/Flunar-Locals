    description-1: "<gray>Schützt dich vor Feuer und"
    description-2: "<gray>Lava in der heißen Schmiede."
  smith_steel_skin:
    name: "Stahlhaut"
    description-1: "<gray>Erhöht vorübergehend deine"
    description-2: "<gray>Widerstandskraft gegen Schaden."
  lumberjack_chop_haste:
    name: "Axt-Eile"
    description-1: "<gray>Verleiht Eile beim Fällen"
    description-2: "<gray>großer Bäume und ganzer Wälder."
  lumberjack_forest_speed:
    name: "Waldläufer"
    description-1: "<gray>Erhöht deine Geschwindigkeit"
    description-2: "<gray>zwischen Bäumen und Holzlagern."
  lumberjack_forest_vision:
    name: "Waldsicht"
    description-1: "<gray>Sorgt auch nachts für klare"
    description-2: "<gray>Sicht in dichten Wäldern."
  trader_market_speed:
    name: "Markt-Eile"
    description-1: "<gray>Erhöht dein Tempo zwischen"
    description-2: "<gray>Handelspartnern und Marktständen."
  trader_fortune:
    name: "Händlergunst"
    description-1: "<gray>Gewährt dir den Held-des-Dorfes-Effekt"
