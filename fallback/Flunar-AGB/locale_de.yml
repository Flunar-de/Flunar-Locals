export:
  players-only: "<red>Dieser Befehl kann nur im Spiel verwendet werden."
  usage: "<yellow>Verwendung: <white>/daten export NAME/UUID [--all]"
  no-permission: "<red>Dafür hast du keine Berechtigung."
  unavailable: "<red>Die administrative Datenauskunft ist momentan nicht verfügbar."
  started: "<gray>Die angeforderte Datenauskunft wird lokal erstellt. Das kann einige Minuten dauern …"
  busy: "<yellow>Die verfügbaren Exportplätze sind momentan belegt."
  not-found: "<yellow>Es wurde kein eindeutiges Minecraft-Konto für %target% gefunden."
  ambiguous: "<yellow>Der Name %target% ist mehrdeutig. Verwende die UUID."
  failed: "<red>Die Datenauskunft konnte nicht erstellt werden. Bitte versuche es später erneut."
  failure-limit: "<red>Grund: Das konfigurierte Schutzlimit für Größe oder Anzahl der Datensätze wurde erreicht."
  failure-schema-changed: "<red>Grund: Das Datenbankschema wurde während des Exports geändert. Bitte starte den Export erneut."
  failure-timeout: "<red>Grund: Eine Datenbankabfrage hat das Zeitlimit überschritten."
  failure-database: "<red>Grund: Eine benötigte Datenbankabfrage ist fehlgeschlagen."
  failure-filesystem: "<red>Grund: Die Exportdatei konnte nicht im Exportordner geschrieben werden."
  failure-unexpected: "<red>Grund: Es ist ein unerwarteter interner Fehler aufgetreten."
  ready: "<green>Datenauskunft erstellt: <white>%file%<gray> im Ordner <white>%directory%"

