  failure-database: "<red>Grond: Eng néideg Datebankufro ass feelgeschloen."
  failure-filesystem: "<red>Grond: D’Exportdatei konnt net an den Exportdossier geschriwwe ginn."
  failure-unexpected: "<red>Grond: En onerwaarten interne Feeler ass opgetrueden."
