  not-found: "<yellow>Не удалось однозначно найти аккаунт Minecraft для %target%."
  ambiguous: "<yellow>Имя %target% неоднозначно. Используйте UUID."
  failed: "<red>Не удалось создать экспорт данных. Повторите попытку позже."
  failure-limit: "<red>Причина: Достигнут настроенный защитный предел размера или количества записей."
  failure-schema-changed: "<red>Причина: Схема базы данных изменилась во время экспорта. Запустите экспорт снова."
  failure-timeout: "<red>Причина: Запрос к базе данных превысил лимит времени."
  failure-database: "<red>Причина: Не удалось выполнить необходимый запрос к базе данных."
  failure-filesystem: "<red>Причина: Не удалось записать файл в папку экспорта."
  failure-unexpected: "<red>Причина: Произошла непредвиденная внутренняя ошибка."
  ready: "<green>Экспорт данных создан: <white>%file%<gray> в папке <white>%directory%"

