  bedrock-decline: "<red>✖ Decline terms"
  checking: "<gray>Checking your saved acceptance …"
  saving: "<yellow>Your acceptance is being saved securely …"
  accepted: "<green>Thank you! Your acceptance has been saved."
  unavailable: "<red>The terms check is currently unavailable. Your connection is being denied as a safety measure."
