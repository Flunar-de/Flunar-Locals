  status-failed: "<red>Your acceptance status cannot be loaded right now."
  standard-text: |-
    <white>Flunar.de Terms and Conditions

    <gray>To play on Flunar.de, you must accept the current terms and conditions.

    <gray>You can find the complete terms at:
    <aqua>https://flunar.de/agb

    <gray>By selecting “Accept”, you confirm that you have read and agree to the terms.

    <gray>If you do not agree, you cannot join the server.

    <dark_gray>Version: %terms_version%

command:
  agbs-players-only: "<red>This command can only be used in game."
  agbs-loading: "<gray>Your terms status is being loaded …"
  agbs-failed: "<red>Your terms status cannot be loaded right now."

export:
  players-only: "<red>This command can only be used in game."
  usage: "<yellow>Usage: <white>/daten export NAME/UUID [--all]"
  no-permission: "<red>You do not have permission to do that."
  unavailable: "<red>The administrative data export is currently unavailable."
  started: "<gray>The requested data export is being created locally. This may take a few minutes …"
  busy: "<yellow>All available export slots are currently occupied."
  not-found: "<yellow>No unambiguous Minecraft account was found for %target%."
  ambiguous: "<yellow>The name %target% is ambiguous. Use the UUID."
  failed: "<red>The data export could not be created. Please try again later."
  failure-limit: "<red>Reason: The configured safety limit for size or record count was reached."
  failure-schema-changed: "<red>Reason: The database schema changed during the export. Please start the export again."
  failure-timeout: "<red>Reason: A database query exceeded its time limit."
  failure-database: "<red>Reason: A required database query failed."
  failure-filesystem: "<red>Reason: The export file could not be written to the export directory."
  failure-unexpected: "<red>Reason: An unexpected internal error occurred."
  ready: "<green>Data export created: <white>%file%<gray> in directory <white>%directory%"

