    <gray>To play on <white>Flunar.de<gray>, you must accept the current terms and conditions.

    <gray>Full terms: <aqua>https://flunar.de/agb
    <gray>Version: <white>%terms_version%

    <yellow>Please make a binding choice now.
  bedrock-accept: "<green>✔ Accept terms"
  bedrock-decline: "<red>✖ Decline terms"
