      name: "<aqua>Ride"
      lore-1: "<gray>Hop onto your companion."
      lore-2: "<dark_gray>» <gray>Sneak to dismount."
      not-rideable: "<dark_gray>» <red>Not rideable."
      not-rideable-message: "<red>This companion is not rideable."
    dismiss:
      name: "<red>Put companion away"
      lore-1: "<gray>Makes your companion disappear."
