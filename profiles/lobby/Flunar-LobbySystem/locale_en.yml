      name: "<yellow>Rename"
      lore-1: "<gray>Give your companion a name."
      token-status: "<dark_gray>» <gray>Rename tokens: <yellow>%tokens%"
    sit:
      name: "<gold>Sit"
      name-standing: "<green>Let stand up"
      lore-1: "<gray>Makes your companion stay seated."
      state-sitting: "<dark_gray>» <gray>Status: <yellow>Sitting"
      state-standing: "<dark_gray>» <gray>Status: <green>Following you"
