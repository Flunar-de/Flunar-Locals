    external-title: "<gradient:#FFD166:#B8FFC7><bold>✦ Your Companion</bold></gradient>"
    item-description: "<gray>Active companion"
    body: "<gradient:#FFD166:#B8FFC7><bold>%pet%</bold></gradient><newline><newline><gray>Owner <dark_gray>•</dark_gray> <white>%owner%</white><newline><gray>Rename tokens <dark_gray>•</dark_gray> <yellow>%tokens%</yellow><newline><gray>%rideable-label% <dark_gray>•</dark_gray> %rideable%"
    rideable:
      label: "Rideable"
      yes: "<green>Yes"
      no: "<red>No"
    actions:
      rename: "<yellow>Rename"
      sit: "<gold>Sit down"
      stand: "<green>Stand up"
      ride: "<aqua>Ride"
      dismiss: "<red>Put companion away"
      close: "<gray>Close"
    tooltips:
      rename: "<gray>Consumes 1 rename token"
      sit: "<gray>Makes your companion stay seated"
      stand: "<gray>Makes your companion follow you again"
      ride: "<gray>Mount your companion"
      dismiss: "<gray>Puts your companion away"
      close: "<gray>Close this dialog"
    rename:
      title: "<gradient:#FFD166:#B8FFC7><bold>Rename Companion</bold></gradient>"
      external-title: "<gradient:#FFD166:#B8FFC7><bold>Choose a New Name</bold></gradient>"
      body: "<gray>Choose a new name for your companion.<newline><newline><yellow>1 token is consumed when confirmed.</yellow>"
      label: "<white>New name"
      confirm: "<green>✓ Confirm"
      confirm-tooltip: "<gray>Rename and consume 1 token"
      cancel: "<red>Cancel"
      cancel-tooltip: "<gray>Back to the companion menu"
      invalid: "<red>The name cannot be empty."
  rename:
    done: "<green>Your companion is now called <yellow>%name%<green>."
    no-tokens: "<red>You do not have a rename token. Buy one in the Lobby Shop."

