# Pets / companions
pets:
  gadget-lore: "<gray>A companion that follows you."
  put-away: "<gray>Your companion was put away."
  no-pet: "<red>You don't have a companion right now."
  nametag: "%pet% <dark_gray>• <gray>%owner%'s companion"
